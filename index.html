<!doctype html>
<html lang="en">
<head>
  <!-- Build and serve from this directory
       rustup target add wasm32-unknown-unknown
       cargo build --release --target wasm32-unknown-unknown
       python3 -m http.server 8000 --bind 127.0.0.1
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radiolarian · Ink proof</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f5f3ec;
  --ink: #282722;
  --muted: #66645c;
  --rule: #c9c6ba;
  --accent: #60513c;
  font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
main { max-width: 1580px; margin: 0 auto; padding: 26px clamp(20px, 4vw, 68px) 28px; }
.masthead {
  border-top: 2px solid var(--ink); padding: 18px 0 21px;
  display: flex; justify-content: space-between; align-items: end; gap: 12px;
}
.classification, .edition, #status, #form-status, #render-progress, #pan-hint { font-size: 13px; line-height: 1.45; }
.classification { margin: 0 0 5px; color: var(--muted); }
.classification i, h1, h2 { font-family: "Baskervville", "Iowan Old Style", Baskerville, Georgia, serif; }
.classification i { font-size: 16px; }
.dot { padding: 0 9px; }
h1 { font-weight: 400; font-size: clamp(44px, 4.2vw, 67px); line-height: .98; letter-spacing: -.045em; margin: 0; }
.edition { display: flex; gap: 10px; align-items: center; padding-bottom: 2px; color: var(--muted); }
.rule { height: 1px; width: 28px; background: var(--rule); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 276px); gap: clamp(25px, 3.2vw, 58px); }
.sheet { min-width: 0; position: relative; }
#viewport {
  position: relative; overflow: hidden; background: black; isolation: isolate;
}
#viewport.detail { cursor: grab; touch-action: none; }
#viewport.dragging { cursor: grabbing; }
#plate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#plate img, #plate canvas { width: 100%; height: 100%; position: absolute; inset: 0; pointer-events: none; }
#plate img { object-fit: contain; }
#render-progress {
  position: absolute; z-index: 1; top: 14px; left: 14px; max-width: calc(100% - 28px);
  margin: 0; color: var(--paper); pointer-events: none; overflow-wrap: anywhere;
}
#render-progress:not(:empty) {
  display: flex; align-items: center; gap: 9px; padding: 6px 10px;
  border-radius: 3px; background: rgb(0 0 0 / 85%);
}
#render-progress:not(:empty)::before {
  content: ""; flex: none; width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid #66645c; border-top-color: currentColor; animation: render-spin .8s linear infinite;
}
@keyframes render-spin { to { transform: rotate(1turn); } }
@media (prefers-reduced-motion: reduce) {
  #render-progress:not(:empty)::before { animation: none; }
}
.view-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
button {
  font: 500 13px/1.25 "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  background: transparent; color: var(--ink); cursor: pointer; border: 1px solid var(--rule);
  border-radius: 3px; padding: 7px 12px;
}
button:hover:enabled { border-color: var(--ink); }
button:focus-visible, input:focus-visible, select:focus-visible, #viewport:focus-visible { outline: 2px solid #917149; outline-offset: 3px; }
button:disabled { opacity: .55; cursor: default; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.switch { display: inline-flex; }
.switch button:first-child { border-radius: 3px 0 0 3px; }
.switch button:last-child { border-radius: 0 3px 3px 0; border-left: 0; }
#pan-hint { margin: 8px 0 0; color: var(--muted); }
aside section { border-top: 1px solid var(--ink); }
aside section + section { margin-top: 24px; }
.panel-title, .control-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel-title { padding: 12px 0 14px; }
h2 { font-size: 31px; line-height: 1.1; letter-spacing: -.035em; font-weight: 400; margin: 0; }
.text-button { padding: 3px 0; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; }
fieldset { min-width: 0; border: 0; padding: 0; margin: 0; }
.control, .shape-control { border-top: 1px solid var(--rule); padding: 9px 0 5px; }
label { font-size: 16px; font-weight: 550; }
output { font: 13px/1 "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
label { line-height: 1.35; }
.form-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.seed-control {
  display: grid; grid-template-columns: 1fr auto; align-items: center;
  gap: 5px 10px; margin-bottom: 12px;
}
.seed-control label { grid-area: 1 / 1; }
#randomise-seed { grid-area: 1 / 2; justify-self: end; }
#local-wasm { margin-bottom: 12px; }
#wasm-file { display: block; margin-top: 4px; max-width: 100%; }
#body-plan, #seed { min-width: 0;
  color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 4px 7px; }
#body-plan { width: 65%; font: inherit; font-size: 14px; }
#seed { grid-area: 2 / 1 / auto / -1; width: 100%; font: 14px/1.4 "SFMono-Regular", Consolas, monospace; text-align: right; }
#apply-form { width: 100%; margin-top: 7px; background: var(--ink); color: var(--paper); border-color: var(--ink); }
#apply-form:disabled { background: transparent; color: var(--muted); border-color: var(--rule); }
#form-status { color: var(--muted); margin: 7px 0 0; }
#form-status:empty { margin: 0; }
#specimen-seed { overflow-wrap: anywhere; }
input[type=range] { width: 100%; margin: 2px 0 0; height: 22px; cursor: pointer; accent-color: var(--accent); display: block; }
fieldset:disabled input { cursor: default; }
.contrast { border-color: var(--ink); }
#status { border-top: 1px solid var(--rule); padding: 12px 0 0; margin: 0; color: var(--muted); }
.sr-only { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; }
@media (min-width: 761px) {
  main {
    display: grid; grid-template-rows: auto 1fr; min-height: min(100svh, 1120px);
    padding: clamp(12px, 2vh, 24px) clamp(20px, 3.4vw, 54px);
  }
  .masthead { padding: 9px 0 clamp(12px, 2vh, 22px); }
  .title-block { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
  h1 { order: -1; font-size: clamp(38px, 6vh, 64px); }
  .classification { margin: 0; }
  .layout { grid-template-columns: minmax(0, 1fr) clamp(328px, 29vw, 400px); gap: clamp(18px, 2.3vw, 36px); }
  .sheet { display: flex; flex-direction: column; }
  #viewport { flex: 1 0 300px; }
  .view-bar { padding: 8px 0; }
  .panel-title { padding: clamp(6px, 1vh, 12px) 0; }
  h2 { font-size: clamp(24px, 3.5vh, 31px); }
  aside section + section { margin-top: clamp(12px, 2vh, 24px); }
  .form-row, .seed-control { margin-bottom: 8px; }
  .seed-control { grid-template-columns: auto minmax(0, 1fr) auto; }
  #seed { grid-area: 1 / 2; }
  #randomise-seed { grid-area: 1 / 3; }
  aside label { font-size: 14px; }
  .shape-control, .control {
    display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 5ch;
    align-items: center; column-gap: 8px; padding: clamp(0px, 2.5vh - 15px, 7px) 0;
  }
  .shape-control .control-head, .control .control-head { display: contents; }
  .shape-control output, .control output { grid-area: 1 / 3; text-align: right; }
  input[type=range] { grid-area: 1 / 2; min-width: 0; height: 28px; margin: 0; }
  #status { padding-top: 8px; }
}
@media (max-width: 760px) {
  main { padding: 14px 16px 24px; }
  .layout { grid-template-columns: 1fr; gap: 22px; }
  .masthead { padding: 12px 0 16px; }
  .edition { flex-direction: column; gap: 1px; align-items: end; }
  .rule { display: none; }
  #viewport { height: clamp(320px, 56svh, 570px); }
  aside { padding-bottom: 12px; }
}
</style>
</head>

  <script type="text/plain" id="growth-worker">
self.onmessage = async ({data: {id, settings, wasm}}) => {
  let renderer;
  try {
    const response = typeof wasm === 'string' ? await fetch(wasm) : new Response(wasm);
    if (!response.ok) {
      throw new Error('Could not load haeckel.wasm (HTTP ' + response.status + '). Run cargo build --release --target wasm32-unknown-unknown, then select Apply form.');
    }
    const {instance} = await WebAssembly.instantiate(await response.arrayBuffer());
    renderer = instance.exports;
    const {width, height, seed, flare, spacing, thickness, age, bodyPlan = 'bell', fineSpines = 1} = settings;
    if (![width, height].every(side => Number.isInteger(side) && side >= 1 && side <= 16384)) {
      throw new Error('Width and height must be integers from 1 to 16,384.');
    }
    if (typeof seed !== 'string' || !/^\d{1,20}$/.test(seed) || BigInt(seed) > (1n << 64n) - 1n) {
      throw new Error('Enter a whole-number seed from 0 to 18446744073709551615.');
    }
    const planIndex = ['bell', 'sphere'].indexOf(bodyPlan);
    if (planIndex < 0) throw new Error('Choose a bell or sphere body plan.');
    if (!Number.isFinite(fineSpines) || fineSpines < 0 || fineSpines > 1) {
      throw new Error('Fine spine density must be between 0 and 1.');
    }
    const ok = renderer.render_specimen(width, height, BigInt(seed), flare, spacing, thickness, age, planIndex, fineSpines);
    const view = kind => new Uint8Array(renderer.memory.buffer,
      renderer.specimen_buffer(kind) >>> 0, renderer.specimen_len(kind) >>> 0);
    if (!ok) throw new Error(new TextDecoder().decode(view(3)));
    // Copy once before releasing Rust's vectors. The recipient owns the transferred buffers.
    const pixels = view(0).slice();
    const data = view(1).slice();
    const tails = view(2).slice();
    self.postMessage({id, width, height, samples: 2, pixels, data, tails},
      [pixels.buffer, data.buffer, tails.buffer]);
  } catch (error) {
    self.postMessage({id, error: error instanceof Error ? error.message : String(error)});
  } finally {
    renderer?.release_specimen();
  }
};
</script>
  <script type="text/wgsl" id="ink-wgsl">
// Each texel records one Rust supersample in print order: shell mask, silver,
// graphite, charcoal. Keep these as byte values until the canvas output.
@group(0) @binding(0) var separations: texture_2d<u32>;
@group(0) @binding(1) var<uniform> weights: vec4f;
override samples: u32 = 2u;

// Subpixel spine tips are laid over the finished pencil in back-to-front order.
struct Tip {
    sample_index: u32,
    source: u32,
    coverage: f32,
}
@group(0) @binding(2) var<storage, read> tips: array<Tip>;
@group(0) @binding(3) var<storage, read> bucket_offsets: array<u32>;

// Match Rust's fixed-point pencil deposit and round only at the same stages.
const one = 4096u;
fn multiply(a: u32, b: u32) -> u32 {
    return (a * b + one / 2u) / one;
}

fn printed_byte(separation: vec4u) -> u32 {
    let pressure = vec4u(floor(clamp(weights, vec4f(0), vec4f(2)) * f32(one) + 0.5));
    let coverage = (separation.gba * one + 127u) / 255u;
    let first = min(pressure.xyz, vec3u(one));
    // Above 100%, a second light pass deposits into the remaining paper.
    // This keeps differences between firm strokes visible at high settings.
    let second = (coverage * (vec3u(one) - coverage) + one / 2u) / one;
    let amount = (coverage * first + second * (pressure.xyz - first) + one / 2u) / one;
    let passes = vec3u(one) - amount;
    let deposit = one - multiply(multiply(passes.x, passes.y), passes.z);
    let contrast = min(pressure.w, one);
    let extra = multiply(deposit, one - deposit);
    let adjusted = multiply(deposit, contrast) + multiply(extra, pressure.w - contrast);
    return (separation.r * (one - adjusted) + one / 2u) / one;
}

fn sample_value(coord: vec2u, row_width: u32) -> u32 {
    var value = printed_byte(textureLoad(separations, coord, 0));
    let address = coord.y * row_width + coord.x;
    let bucket = address >> 8u;
    var first = bucket_offsets[bucket];
    var end = bucket_offsets[bucket + 1u];
    let limit = end;
    // Each bucket covers 256 neighbouring samples. Most contain no tips.
    while first < end {
        let mid = first + (end - first) / 2u;
        if tips[mid].sample_index < address { first = mid + 1u; }
        else { end = mid; }
    }
    while first < limit {
        let tip = tips[first];
        if tip.sample_index != address { break; }
        let layers = (vec4u(tip.source) >> vec4u(0u, 8u, 16u, 24u)) & vec4u(255u);
        let under = f32(value);
        let over = f32(printed_byte(layers));
        value = u32(floor(under + tip.coverage * (over - under) + 0.5));
        first += 1u;
    }
    return value;
}

@vertex fn vertex_main(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
    let positions = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
    return vec4f(positions[i], 0.0, 1.0);
}

@fragment fn fragment_main(@builtin(position) position: vec4f) -> @location(0) vec4f {
    let origin = vec2u(position.xy) * samples;
    let row_width = textureDimensions(separations).x;
    var sum = 0u;
    for (var dy = 0u; dy < samples; dy++) {
        for (var dx = 0u; dx < samples; dx++) {
            sum += sample_value(origin + vec2u(dx, dy), row_width);
        }
    }
    let area = samples * samples;
    let byte = (sum + area / 2u) / area;
    return vec4f(vec3f(f32(byte) / 255.0), 1.0);
}
</script>
  <script type="module">
// Offsets into the sorted list of subpixel tip deposits. A fragment can
// skip an entire empty stretch of the print with two reads.
function indexTipDeposits(bytes, sampleCount) {
    if (!ArrayBuffer.isView(bytes) || bytes.byteLength % 12 !== 0) {
        throw new Error("The proof contains an incomplete spine tip record.");
    }
    const records = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const count = bytes.byteLength / 12;
    const offsets = new Uint32Array(Math.ceil(sampleCount / 256) + 1);
    let lastAddress = 0;
    let nextBucket = 0;
    for (let i = 0; i < count; i++) {
        const at = i * 12;
        const address = records.getUint32(at, true);
        const source = records.getUint32(at + 4, true);
        const coverage = records.getFloat32(at + 8, true);
        if (address >= sampleCount || address < lastAddress || (source & 255) !== 255 ||
            !(coverage >= 0 && coverage <= 1)) {
            throw new Error("The proof contains an invalid spine tip record.");
        }
        while (nextBucket <= Math.floor(address / 256)) offsets[nextBucket++] = i;
        lastAddress = address;
    }
    offsets.fill(count, nextBucket);
    return offsets;
}

async function createInkRenderer(canvas, proof, {onLost} = {}) {
    const {width, height, samples, data, tails = new Uint8Array()} = proof;
    if (![width, height, samples].every(n => Number.isSafeInteger(n) && n > 0)) {
        throw new Error("The proof has invalid dimensions.");
    }
    const sw = width * samples;
    const sh = height * samples;
    const sampleCount = sw * sh;
    if (!ArrayBuffer.isView(data) || data.byteLength !== sampleCount * 4 ||
        sampleCount > 0xffff_ffff) {
        throw new Error("The shell mask and pencil passes do not match the proof dimensions.");
    }
    const offsets = indexTipDeposits(tails, sampleCount);
    const clearTip = new Uint8Array(12);
    const deposits = tails.byteLength ? tails : clearTip;
    if (!navigator.gpu) {
        throw new Error("WebGPU is unavailable. Open this proof in a WebGPU-enabled browser.");
    }
    const shaderSource = document.querySelector("#ink-wgsl")?.textContent;
    if (!shaderSource?.trim()) throw new Error("The proof is missing its ink shader.");
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error("This browser could not find a WebGPU adapter.");
    const dimension = Math.max(sw, sh);
    const bufferBytes = Math.max(deposits.byteLength, offsets.byteLength);
    if (dimension > adapter.limits.maxTextureDimension2D ||
        bufferBytes > Math.min(adapter.limits.maxStorageBufferBindingSize, adapter.limits.maxBufferSize)) {
        throw new Error("This proof exceeds the texture or memory limits of this GPU.");
    }
    const device = await adapter.requestDevice({
        label: "Ink proof",
        requiredLimits: {
            maxTextureDimension2D: dimension,
            maxStorageBufferBindingSize: bufferBytes,
            maxBufferSize: Math.max(16, bufferBytes),
        },
    });
    let closed = false;
    const context = canvas.getContext("webgpu");
    function destroy() {
        if (closed) return;
        closed = true;
        context?.unconfigure();
        device.destroy();
    }
    device.lost.then(info => {
        if (!closed) onLost?.(new Error(info.message || "The browser lost its connection to the GPU."));
    });
    device.addEventListener("uncapturederror", event => {
        if (!closed) onLost?.(new Error(event.error.message || "The GPU could not draw the proof."));
    });
    try {
        if (!context) throw new Error("This browser could not open a WebGPU canvas.");
        device.pushErrorScope("out-of-memory");
        device.pushErrorScope("validation");
        const format = navigator.gpu.getPreferredCanvasFormat();
        canvas.width = width;
        canvas.height = height;
        context.configure({device, format, alphaMode: "opaque", colorSpace: "srgb"});
        const texture = device.createTexture({
            label: "Shell mask and three pencil passes",
            size: [sw, sh], format: "rgba8uint",
            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
        });
        device.queue.writeTexture({texture}, data, {bytesPerRow: sw * 4}, [sw, sh]);
        function storage(label, bytes) {
            const buffer = device.createBuffer({
                label, size: bytes.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
            });
            device.queue.writeBuffer(buffer, 0, bytes);
            return {buffer};
        }
        const tips = storage("Spine tip deposits", deposits);
        const buckets = storage("Deposit index", offsets);
        const weights = device.createBuffer({
            label: "Ink controls", size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });
        const module = device.createShaderModule({label: "Ink compositor", code: shaderSource});
        const pipeline = await device.createRenderPipelineAsync({
            label: "Resolve ink to paper",
            layout: "auto",
            vertex: {module, entryPoint: "vertex_main"},
            fragment: {module, entryPoint: "fragment_main", constants: {samples}, targets: [{format}]},
            primitive: {topology: "triangle-list"},
        });
        const group = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
                {binding: 0, resource: texture.createView()}, {binding: 1, resource: {buffer: weights}},
                {binding: 2, resource: tips}, {binding: 3, resource: buckets},
            ],
        });
        const invalid = await device.popErrorScope();
        const memory = await device.popErrorScope();
        if (invalid || memory) throw new Error((invalid || memory).message);
        const controls = new Float32Array(4);
        function draw({silver = 1.76, graphite = 1.30, charcoal = 1.08, contrast = 1} = {}) {
            if (closed) return;
            controls.set([silver, graphite, charcoal, contrast]);
            device.queue.writeBuffer(weights, 0, controls);
            const encoder = device.createCommandEncoder();
            const pass = encoder.beginRenderPass({colorAttachments: [{
                view: context.getCurrentTexture().createView(),
                loadOp: "clear", clearValue: [0, 0, 0, 1], storeOp: "store",
            }]});
            pass.setPipeline(pipeline);
            pass.setBindGroup(0, group);
            pass.draw(3);
            pass.end();
            device.queue.submit([encoder.finish()]);
        }
        return {draw, destroy};
    } catch (error) {
        destroy();
        throw error;
    }
}

const byId = id => document.getElementById(id);
const viewport = byId('viewport');
const plate = byId('plate');
const reference = byId('reference');
let canvas = byId('live');
const status = byId('status');
const controls = byId('controls');
const inputs = [...controls.querySelectorAll('input')];
const printWidth = 2400;
const printHeight = 3000;
const previewWidth = 960;
const previewHeight = 1200;
let width = previewWidth;
let height = previewHeight;
let renderer;
let detail = false;
let focal = [0.62, 0.66];
let drag = null;
let scale = 1;
let pendingDraw = 0;

function updateView() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const fit = Math.min(vw / width, vh / height);
  scale = detail ? Math.max(1, fit * 2) : fit;
  const w = width * scale, h = height * scale;
  const position = (size, windowSize, center) => size <= windowSize
    ? (windowSize - size) / 2
    : Math.min(0, Math.max(windowSize - size, windowSize / 2 - center * size));
  const x = position(w, vw, detail ? focal[0] : 0.5);
  const y = position(h, vh, detail ? focal[1] : 0.5);
  if (detail) focal = [(vw / 2 - x) / w, (vh / 2 - y) / h];
  plate.style.width = w + 'px';
  plate.style.height = h + 'px';
  plate.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
}

function setDetail(active) {
  detail = active;
  viewport.classList.toggle('detail', active);
  byId('portrait').setAttribute('aria-pressed', String(!active));
  byId('detail').setAttribute('aria-pressed', String(active));
  byId('pan-hint').hidden = !active;
  updateView();
}
byId('portrait').onclick = () => setDetail(false);
byId('detail').onclick = () => setDetail(true);
new ResizeObserver(updateView).observe(viewport);
updateView();

viewport.onpointerdown = event => {
  if (!detail || event.button !== 0 || drag) return;
  viewport.setPointerCapture(event.pointerId);
  drag = { id: event.pointerId, x: event.clientX, y: event.clientY, center: focal };
  viewport.classList.add('dragging');
};
viewport.onpointermove = event => {
  if (!drag || drag.id !== event.pointerId) return;
  focal = [
    drag.center[0] - (event.clientX - drag.x) / (width * scale),
    drag.center[1] - (event.clientY - drag.y) / (height * scale),
  ];
  updateView();
};
viewport.onlostpointercapture = () => {
  drag = null;
  viewport.classList.remove('dragging');
};
viewport.onkeydown = event => {
  const shift = { ArrowLeft: [-1,0], ArrowRight: [1,0], ArrowUp: [0,-1], ArrowDown: [0,1] }[event.key];
  if (!detail || !shift) return;
  event.preventDefault();
  focal = [focal[0] + 60 * shift[0] / (width * scale), focal[1] + 60 * shift[1] / (height * scale)];
  updateView();
};

function showLiveCanvas(visible) {
  canvas.hidden = !visible;
  reference.hidden = visible;
}

function settings() {
  return Object.fromEntries(inputs.map(input => [input.id, Number(input.value) / 100]));
}
function updateControls() {
  for (const input of inputs) {
    controls.querySelector('output[for="' + input.id + '"]').value = input.value + '%';
    input.setAttribute('aria-valuetext', input.value + '%');
  }
  byId('reset').disabled = !renderer || inputs.every(input => input.value === input.defaultValue);
}
function showFailure(error) {
  cancelAnimationFrame(pendingDraw);
  pendingDraw = 0;
  const previous = renderer;
  renderer = null;
  previous?.destroy();
  controls.disabled = true;
  showLiveCanvas(false);
  for (const input of inputs) input.value = input.defaultValue;
  updateControls();
  status.textContent = 'Showing the default shading. ' + (error?.message || String(error));
}
function draw() {
  pendingDraw = 0;
  if (!renderer) return;
  try {
    renderer.draw(settings());
    showLiveCanvas(true);
  } catch (error) {
    showFailure(error);
  }
}
function updateInk() {
  updateControls();
  if (!pendingDraw) pendingDraw = requestAnimationFrame(draw);
}
controls.oninput = updateInk;
byId('reset').onclick = () => {
  for (const input of inputs) input.value = input.defaultValue;
  updateInk();
};

async function enableShading(surface, proof) {
  let lost = false;
  preparingShading = true;
  updateRenderProgress();
  try {
    if (!navigator.gpu) throw new Error('A WebGPU browser enables live shading.');
    const next = await createInkRenderer(surface, proof, {onLost(error) {
      lost = true;
      if (surface === canvas) showFailure(error);
    }});
    if (surface !== canvas || lost) {
      next.destroy();
      return;
    }
    renderer = next;
    controls.disabled = false;
    updateControls();
    status.textContent = 'Live shading · WebGPU';
    draw();
  } catch (error) {
    if (surface === canvas) showFailure(error);
  } finally {
    if (surface === canvas) {
      preparingShading = false;
      updateRenderProgress();
    }
  }
}

const form = byId('form-controls');
const planInput = byId('body-plan');
const seedInput = byId('seed');
const randomiseButton = byId('randomise-seed');
const shapeInputs = [...form.querySelectorAll('input[type="range"]')];
const formStatus = byId('form-status');
const renderProgress = byId('render-progress');
const canGrow = typeof Worker === 'function' && typeof WebAssembly === 'object';
const localView = location.protocol === 'file:';
const wasmPath = 'target/wasm32-unknown-unknown/release/haeckel.wasm';
const wasmFile = byId('wasm-file');
byId('local-wasm').hidden = !localView || !canGrow;
const seedLimit = '18446744073709551615';
let worker = null;
let workerUrl = null;
let generation = 0;
let requested = null;
let renderingPrint = false;
let preparingShading = false;
let formMessage = '';
const original = {
  bodyPlan: planInput.querySelector('option[selected]').value,
  seed: seedInput.defaultValue,
  ...Object.fromEntries(shapeInputs.map(input => [input.name || input.id, Number(input.defaultValue)])),
};
let shown = null;

function specimenSettings() {
  const seed = seedInput.value.replace(/^0+(?=.)/, '');
  if (!/^[0-9]+$/.test(seed) || seed.length > seedLimit.length
      || (seed.length === seedLimit.length && seed > seedLimit)) return null;
  return {bodyPlan: planInput.value, seed, ...Object.fromEntries(shapeInputs.map(input => [input.name || input.id, Number(input.value)]))};
}

function sameForm(a, b) {
  return a && b && Object.keys(original).every(key => a[key] === b[key]);
}

function updateRenderProgress() {
  let message = '';
  if (requested) {
    message = (renderingPrint ? 'Rendering print ' : 'Drawing specimen ') + requested.seed + '…';
  } else if (preparingShading) {
    message = 'Preparing shading…';
  }
  if (renderProgress.textContent !== message) renderProgress.textContent = message;
  viewport.setAttribute('aria-busy', String(Boolean(message)));
}

function updateForm() {
  byId('scale-label').textContent = planInput.selectedOptions[0].dataset.scale;
  for (const input of shapeInputs) {
    const value = Number(input.value);
    const label = input.dataset.unit === 'percent' ? Math.round(100 * value) + '%' : value.toFixed(2) + '×';
    form.querySelector('output[for="' + input.id + '"]').value = label;
    input.setAttribute('aria-valuetext', label);
  }
  const settings = specimenSettings();
  const ready = canGrow && (!localView || wasmFile.files.length > 0);
  const error = settings ? '' : 'Enter a whole-number seed from 0 to ' + seedLimit + '.';
  seedInput.setCustomValidity(error);
  randomiseButton.disabled = !ready;
  byId('apply-form').disabled = !ready || !settings || sameForm(settings, requested || shown);
  byId('reset-form').disabled = !ready || (sameForm(requested || shown || original, original) && sameForm(settings, original));
  byId('print-size').hidden = !shown || width === printWidth;
  byId('print-size').disabled = !ready || Boolean(requested);
  updateRenderProgress();
  if (!canGrow) {
    formStatus.textContent = 'Interactive rendering requires WebAssembly and web workers.';
  } else if (!ready) {
    formStatus.textContent = 'Under Specimen, choose ' + wasmPath + ' to change the drawing.';
  } else {
    formStatus.textContent = error || formMessage;
  }
}

function showPlate(settings, proof) {
  const {width: w, height: h, pixels} = proof;
  paintReference(pixels, w, h);
  cancelAnimationFrame(pendingDraw);
  pendingDraw = 0;
  renderer?.destroy();
  renderer = null;
  // A retired asynchronous pipeline owns only its own canvas and device.
  const replacement = canvas.cloneNode(false);
  canvas.replaceWith(replacement);
  canvas = replacement;
  width = w;
  height = h;
  shown = settings;
  byId('local-wasm').hidden = true;
  const plan = [...planInput.options].find(option => option.value === settings.bodyPlan);
  byId('classification').textContent = plan.dataset.group;
  canvas.setAttribute('aria-label', 'Pencil drawing of a radiolarian · ' + plan.textContent);
  reference.setAttribute('aria-label', 'Default shading · ' + plan.textContent);
  byId('specimen-seed').textContent = settings.seed;
  byId('dimensions').textContent = (w === printWidth ? '' : 'Preview · ') + w + ' × ' + h + ' px';
  controls.disabled = true;
  updateControls();
  showLiveCanvas(false);
  byId('initial-print').hidden = true;
  updateView();
  status.textContent = '';
  enableShading(canvas, proof);
}

function paintReference(pixels, w, h) {
  if (pixels.length !== w * h) throw new Error('The drawing dimensions do not match the pixels.');
  reference.width = w;
  reference.height = h;
  const context = reference.getContext('2d', {alpha: false});
  const image = context.createImageData(w, h);
  for (let i = 0; i < pixels.length; i++) {
    const at = 4 * i;
    image.data[at] = image.data[at + 1] = image.data[at + 2] = pixels[i];
    image.data[at + 3] = 255;
  }
  context.putImageData(image, 0, 0);
}

function stopWorker() {
  worker?.terminate();
  if (workerUrl) URL.revokeObjectURL(workerUrl);
  worker = workerUrl = requested = null;
}

function applyForm(settings, printSize = false) {
  const id = ++generation;
  stopWorker();
  formMessage = '';
  if (sameForm(settings, shown) && (!printSize || width === printWidth)) {
    updateForm();
    return;
  }
  function failed(message) {
    if (id !== generation) return;
    stopWorker();
    formMessage = message;
    updateForm();
  }
  requested = settings;
  renderingPrint = printSize;
  updateForm();
  try {
    workerUrl = URL.createObjectURL(new Blob([byId('growth-worker').textContent], {type: 'text/javascript'}));
    worker = new Worker(workerUrl);
    worker.onerror = event => failed(event.message || 'The specimen could not be drawn.');
    worker.onmessage = ({data}) => {
      if (id !== generation || data.id !== id) return;
      if (data.error) {
        failed(data.error);
        return;
      }
      stopWorker();
      try {
        showPlate(settings, data);
      } catch (error) {
        formMessage = error.message;
      }
      updateForm();
    };
    const wasm = localView ? wasmFile.files[0] : new URL(wasmPath, document.baseURI).href;
    const width = printSize ? printWidth : previewWidth;
    const height = printSize ? printHeight : previewHeight;
    worker.postMessage({id, settings: {...settings, width, height}, wasm});
  } catch (error) {
    failed(error.message);
  }
}

form.oninput = () => {
  formMessage = '';
  updateForm();
};
form.onsubmit = event => {
  event.preventDefault();
  const settings = specimenSettings();
  if (settings && !byId('apply-form').disabled) applyForm(settings);
};
randomiseButton.onclick = () => {
  const previousSeed = specimenSettings()?.seed;
  const word = new BigUint64Array(1);
  let seed;
  do {
    seed = crypto.getRandomValues(word)[0].toString();
  } while (seed === previousSeed);
  seedInput.value = seed;
  applyForm(specimenSettings());
};
byId('print-size').onclick = () => applyForm(shown, true);
byId('reset-form').onclick = () => {
  form.reset();
  applyForm(original);
};
wasmFile.onchange = () => {
  const settings = specimenSettings();
  if (wasmFile.files.length && settings) applyForm(settings);
  else updateForm();
};
if (canGrow && !localView) applyForm(specimenSettings() ?? original);
else updateForm();
</script>
